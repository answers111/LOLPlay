[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-world"
version = "0.1.0"
description = "LOL-world: composable League of Legends game environment operations"
requires-python = ">=3.10"

[project.optional-dependencies]
# OpenAI agents only.
responses = [
    "openai>=2",
    "pydirectinput-rgx==2.1.3",
    "pyautogui==0.9.54",
    "python-dotenv>=1",
    "pyperclip>=1.9",
]
# Claude PromptAgent and StreamingPromptAgent.
anthropic = [
    "anthropic>=1.11.0",
    "pydirectinput-rgx==2.1.3",
    "pyautogui==0.9.54",
    "python-dotenv>=1",
    "pyperclip>=1.9",
]
# Both providers for environments that run all agent types.
all = [
    "openai>=2",
    "anthropic>=1.11.0",
    "pydirectinput-rgx==2.1.3",
    "pyautogui==0.9.54",
    "python-dotenv>=1",
    "pyperclip>=1.9",
]

[tool.setuptools.packages.find]
include = ["lolworld_env*", "task*", "agents*", "desktop_env*"]
